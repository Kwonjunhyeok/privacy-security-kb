name: kb-watch

# 공공기관 게시판을 매일 1회 확인해 새 안내서·가이드가 올라오면 이슈를 연다(AI 미사용, 비용 없음).
# 이슈(라벨 kb-new-item)가 신호가 되어 클라우드 루틴이 그 항목만 수집·검증한다. 설정은 docs/watch.md.
# 상태(이미 본 게시물)는 main 이 아니라 watch-state 브랜치에 저장한다.
# PR 에서는 시험(probe) 모드로 접속 가능 여부만 확인하고 상태·이슈를 건드리지 않는다.

on:
  schedule:
    - cron: '17 21 * * *'   # 매일 06:17 KST
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/watch/**'
      - '.github/workflows/kb-watch.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: kb-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 시험 모드 (PR)
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/watch/watch.py --state "$RUNNER_TEMP/state" --out result.json --probe | tee probe.txt
          { echo '### kb-watch 접속 시험'; echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 상태 받기
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git clone --quiet --branch watch-state --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" state 2>/dev/null || mkdir state

      - name: 감시
        if: github.event_name != 'pull_request'
        id: watch
        run: |
          set +e
          python3 scripts/watch/watch.py --state state --out result.json | tee watch.txt
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          { echo '### kb-watch'; echo '```'; cat watch.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 상태 저장
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd state
          [ -d .git ] || { git init -q -b watch-state; git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"; }
          git config user.name 'kb-watch'; git config user.email 'kb-watch@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || { git commit -q -m "watch-state $(date -u +%F)"; git push -q origin watch-state; }

      - name: 새 항목 이슈
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > issue.md
          import json
          r = json.load(open('result.json', encoding='utf-8'))
          if not r['new']:
              raise SystemExit
          print('공공기관 게시판에서 새 게시물이 확인됐다. 클라우드 루틴은 아래 항목만 수집·검증한다(전수 점검 아님).\n')
          for n in r['new']:
              print(f"- [{n['title']}]({n['url']}) — {n['name']} (게시판 `{n['board']}`)")
          print('\n처리 후 이슈를 닫는다. 검증을 통과하지 못한 항목은 `kb/_pending` 에 남는다.')
          PY
          if [ -s issue.md ]; then
            gh label create kb-new-item --color 0E8A16 --description "새 안내서·가이드 감지" 2>/dev/null || true
            gh issue create --title "새 게시물 감지 $(TZ=Asia/Seoul date +%F)" --label kb-new-item --body-file issue.md
          fi

      - name: 오류 보고
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > err.md
          import json
          r = json.load(open('result.json', encoding='utf-8'))
          if not r['errors']:
              raise SystemExit
          print('감시 중 읽지 못한 게시판이 있다. 접속 차단이나 목록 구조 변경일 수 있다.\n')
          for e in r['errors']:
              print(f"- {e['name']} (`{e['board']}`): {e['error']}")
          PY
          if [ -s err.md ]; then
            gh label create kb-watch-error --color D93F0B --description "감시 오류" 2>/dev/null || true
            gh issue create --title "감시 오류 $(TZ=Asia/Seoul date +%F)" --label kb-watch-error --body-file err.md
          fi

      - name: 전체 실패 시 종료코드
        if: github.event_name != 'pull_request' && steps.watch.outputs.rc != '0'
        run: exit 1
